<div id="app">

    </div>

      <span class="pill radiance" id="hud-radiance" title="Radiance">✧ 0</span>
      <span class="pill flame" id="hud-flame" title="Flame units">0 flame</span>
      <span class="hud-counts">

        </span>

<!-- Boot resilience: a real module failure (or a 45s hang) reveals this
     overlay. An 8s timer used to dump it while GitHub Pages was still
     fetching the graph after a document navigation to items.js — the save
     was fine; Retry recovered. Kindling waits. Do not set display:flex on
     #boot-fallback alone: ID specificity beats UA [hidden]{display:none}. -->
<div id="boot-fallback" hidden role="alertdialog" aria-label="Hollowlight failed to load">
  <style>
    #boot-fallback {
      position: fixed; inset: 0; z-index: 9999;
      flex-direction: column; align-items: center;
      justify-content: center; gap: 1rem; padding: 2rem;
      text-align: center;
      background: #07090d; color: #cfd6dd;
      font-family: Georgia, 'Times New Roman', serif;
    }
    #boot-fallback[hidden] { display: none !important; }
    #boot-fallback:not([hidden]) { display: flex; }
    #boot-fallback .boot-flame { font-size: 2.4rem; line-height: 1; }
    #boot-fallback h1 {
      margin: 0; font-size: 1.25rem; font-weight: normal;
      letter-spacing: 0.08em; color: #d9a441; text-transform: uppercase;
    }
    #boot-fallback p { margin: 0; max-width: 22rem; line-height: 1.5; }
    #boot-fallback button {
      min-width: 44px; min-height: 44px; padding: 0.75rem 2rem;
      border: 1px solid #d9a441; border-radius: 8px;
      background: transparent; color: #d9a441;
      font-size: 1rem; letter-spacing: 0.05em; cursor: pointer;
    }
    #boot-fallback button:active { background: rgba(217, 164, 65, 0.15); }
  </style>
  <span class="boot-flame" aria-hidden="true">🕯️</span>
  <h1>The lantern flickers in the wind…</h1>
  <p>Hollowlight could not finish kindling — the road here gave out.
     Wait a breath, then try again.</p>
  <button type="button" id="boot-retry" onclick="location.reload()">Retry</button>
</div>
<script>
(function () {
  'use strict';
  function reveal() {
    if (window.__HOLLOWLIGHT_BOOTED) return;
    var f = document.getElementById('boot-fallback');
    if (f) f.hidden = false;
  }
  window.__HOLLOWLIGHT_BOOT_FAIL = reveal;
  try {
    var raw = window.localStorage.getItem('hollowlight.save');
    if (raw) {
      var env = JSON.parse(raw);
      var st = env && env.state ? env.state : {};
      function setText(id, text) {
        var n = document.getElementById(id);
        if (n) n.textContent = text;
      }
      if (typeof st.lumen === 'number') setText('hud-lumen', '✦ ' + st.lumen);
      if (typeof st.radiance === 'number') setText('hud-radiance', '✧ ' + st.radiance);
      if (typeof st.flame === 'number') setText('hud-flame', st.flame + ' flame');
    }
  } catch (e) {}
  // Last-resort hang only. Module waterfalls after items.js must be allowed
  // to finish — an 8s crash overlay raced a healthy save.
  window.setTimeout(reveal, 45000);
})();
</script>
<script type="module">
import('./src/ui/app.js').catch(function () {
  if (typeof window.__HOLLOWLIGHT_BOOT_FAIL === 'function') window.__HOLLOWLIGHT_BOOT_FAIL();
});
</script>
