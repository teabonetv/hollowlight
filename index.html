<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07090d">
<meta name="description" content="Hollowlight — a dark-lantern gothic idle RPG about carrying light back into a world that lost it.">
<title>Hollowlight</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2307090d'/%3E%3Ccircle cx='16' cy='15' r='7' fill='%23d9a441'/%3E%3Ccircle cx='16' cy='13.5' r='3.4' fill='%23ffe9b0'/%3E%3Crect x='11' y='24' width='10' height='2.4' rx='1.2' fill='%238a6a2a'/%3E%3C/svg%3E">
<link rel="stylesheet" href="./src/ui/styles.css">
</head>
<body>
<div id="app">

  <header class="topbar">
    <div class="brand" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5c2.2 2.8 4.8 4.4 4.8 7.9a4.8 4.8 0 0 1-9.6 0c0-1.9.9-3.2 1.9-4.6.4 1.3 1.1 2 2.2 2.1-.3-1.9-.1-3.7.7-5.4z"/><path d="M12 21v-2"/></svg>
      <span>HOLLOWLIGHT</span>
    </div>
    <div class="wallet">
      <span class="pill gold" id="hud-lumen" title="Lumen">✦ 20</span>
      <span class="pill flame" id="hud-flame" title="Flame units">0 flame</span>
      <button class="icon-btn" id="btn-settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 7h9M17 7h3M4 12h3M11 12h9M4 17h13"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="19" cy="17" r="2"/></svg>
      </button>
    </div>
  </header>

  <main id="screen" aria-live="off"></main>

  <nav class="tabbar" role="tablist" aria-label="Main navigation">
    <button data-tab="camp" role="tab" aria-selected="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l8-13 8 13"/><path d="M8 20l4-6.5 4 6.5M2.5 20h19"/></svg>
      <span>Camp</span>
    </button>
    <button data-tab="skills" role="tab" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21v-2"/><path d="M12 3.5c2.2 2.8 4.8 4.4 4.8 7.9a4.8 4.8 0 0 1-9.6 0c0-1.9.9-3.2 1.9-4.6.4 1.3 1.1 2 2.2 2.1-.3-1.9-.1-3.7.7-5.4z"/></svg>
      <span>Skills</span>
    </button>
    <button data-tab="bank" role="tab" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="7" width="16" height="13" rx="2"/><path d="M4 12h16M4 10c0-2 2-3.5 5-4h6c3 .5 5 2 5 4"/><circle cx="12" cy="15" r="1.3"/></svg>
      <span>Bank</span>
    </button>
    <button data-tab="map" role="tab" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4L4 6v14l5-2 6 2 5-2V4l-5 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg>
      <span>Map</span>
    </button>
    <button data-tab="journal" role="tab" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6c-1.5-1.4-3.6-2-6.5-2v14c2.9 0 5 .6 6.5 2 1.5-1.4 3.6-2 6.5-2V4c-2.9 0-5 .6-6.5 2z"/><path d="M12 6v14"/></svg>
      <span>Journal</span>
    </button>
  </nav>

  <div id="toasts" aria-live="polite"></div>
  <div id="modal-root"></div>

</div>

<!-- F1d Fix 3: boot-resilience fallback. If a JS module fails to load (e.g.
     a transient 503 on GitHub Pages), the page would otherwise stay blank
     forever. This watchdog is plain inline script with inline styles — it
     needs no external file — and reveals a styled retry screen if the app
     hasn't signalled a successful boot within 8 seconds. -->
<div id="boot-fallback" hidden role="alertdialog" aria-label="Hollowlight failed to load">
  <style>
    #boot-fallback {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 1rem; padding: 2rem;
      text-align: center;
      background: #07090d; color: #cfd6dd;
      font-family: Georgia, 'Times New Roman', serif;
    }
    #boot-fallback .boot-flame { font-size: 2.4rem; line-height: 1; }
    #boot-fallback h1 {
      margin: 0; font-size: 1.25rem; font-weight: normal;
      letter-spacing: 0.08em; color: #d9a441; text-transform: uppercase;
    }
    #boot-fallback p { margin: 0; max-width: 22rem; line-height: 1.5; }
    #boot-fallback button {
      min-width: 44px; min-height: 44px; padding: 0.75rem 2rem;
      border: 1px solid #d9a441; border-radius: 8px;
      background: transparent; color: #d9a441;
      font-size: 1rem; letter-spacing: 0.05em; cursor: pointer;
    }
    #boot-fallback button:active { background: rgba(217, 164, 65, 0.15); }
  </style>
  <span class="boot-flame" aria-hidden="true">🕯️</span>
  <h1>The lantern flickers in the wind…</h1>
  <p>Hollowlight could not finish kindling — the road here gave out.
     Wait a breath, then try again.</p>
  <button type="button" id="boot-retry" onclick="location.reload()">Retry</button>
</div>
<script>
(function () {
  'use strict';
  window.setTimeout(function () {
    if (window.__HOLLOWLIGHT_BOOTED) return;
    var f = document.getElementById('boot-fallback');
    if (f) f.hidden = false;
  }, 8000);
})();
</script>
<script type="module" src="./src/ui/app.js"></script>
</body>
</html>
